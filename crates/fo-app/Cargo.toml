[package]
name = "fo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FileOdyssey — offline file and image toolkit"

[lib]
name = "fo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fo-types.workspace = true
fo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Mobile-only plugins: on desktop they build to nothing but still provide
# their permissions, which the Android capability names.
tauri-plugin-barcode-scanner = "2"
tauri-plugin-fo-android = { path = "../tauri-plugin-fo-android" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
