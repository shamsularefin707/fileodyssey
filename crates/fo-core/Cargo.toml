[package]
name = "fo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fo-types.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile = "3"
infer = "0.22"
zip = { version = "2.6", default-features = false, features = ["deflate", "deflate64", "lzma"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "xz"] }
ruzstd = "0.9"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "util"] }
lopdf = { version = "0.47", default-features = false }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
ravif = { version = "0.13", default-features = false }
rgb = "0.8"
webp = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"
tiff = "0.11.2"
oxipng = { version = "10", default-features = false }
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }
zune-jpegxl = "0.5"
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "raster-images"] }
psd = "0.3"
rawler = "0.8"
rxing = { version = "0.9", default-features = false, features = ["encoding_rs", "decoders", "encoders", "full_barcode_format_support", "multi_barcode_readers"] }
pdf-writer = "0.15"
miniz_oxide = "0.8"
zune-core = "0.5"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }
ammonia = "4.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quick-xml = "0.42"
exif = { package = "kamadak-exif", version = "0.6" }
chardetng = "1"
encoding_rs = "0.8"
percent-encoding = "2"
similar = "2"
csv = "1"
rust_xlsxwriter = { version = "0.103", default-features = false }
docx-rs = { version = "0.4.22", default-features = false, features = ["image"] }
unicode-normalization = "0.1"

[dev-dependencies]
calamine = "0.38"
similar = "2"
tempfile = "3"
crc32fast = "1"
