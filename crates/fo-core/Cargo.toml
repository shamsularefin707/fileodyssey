[package]
name = "fo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fo-types.workspace = true
serde_json.workspace = true
infer = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
ravif = { version = "0.13", default-features = false }
rgb = "0.8"
webp = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"
oxipng = { version = "10", default-features = false }
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }
zune-jpegxl = "0.5"
resvg = { version = "0.50", default-features = false }
psd = "0.3"
rawler = "0.8"
rxing = { version = "0.9", default-features = false, features = ["encoding_rs", "decoders", "encoders", "full_barcode_format_support", "multi_barcode_readers"] }
pdf-writer = "0.15"
miniz_oxide = "0.8"
zune-core = "0.5"

[dev-dependencies]
tempfile = "3"
crc32fast = "1"
