[workspace]
resolver = "2"
members = ["crates/fo-app", "crates/fo-types", "crates/fo-core", "crates/fo-ui", "crates/tauri-plugin-fo-android"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/shamsularefin707/fileodyssey"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fo-types = { path = "crates/fo-types" }
fo-core = { path = "crates/fo-core" }

# Keep build folders small: line numbers for our crates, no debug info for
# dependencies (image/codec crates otherwise produce tens of GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
