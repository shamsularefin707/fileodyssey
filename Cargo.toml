[workspace]
resolver = "2"
members = ["crates/fo-types", "crates/fo-core", "crates/fo-app", "crates/fo-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/shamsularefin707/fileodyssey"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fo-types = { path = "crates/fo-types" }
fo-core = { path = "crates/fo-core" }
