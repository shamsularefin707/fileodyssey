name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev qpdf
      - name: PDFium (reader engine)
        run: scripts/fetch-pdfium.sh linux-x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build UI (needed by tauri-build)
        run: trunk build --config crates/fo-ui/Trunk.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p fo-ui --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop:
    name: Desktop bundle (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      - name: PDFium (Linux)
        if: runner.os == 'Linux'
        run: scripts/fetch-pdfium.sh linux-x64
      - name: PDFium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1
      - name: Build bundle
        working-directory: crates/fo-app
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: fileodyssey-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    name: Android debug APK
    needs: check
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the removed "tools" package, which fails.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      - name: Generate Android project
        working-directory: crates/fo-app
        run: cargo tauri android init --ci
      - name: PDFium for each Android ABI
        run: |
          scripts/fetch-pdfium.sh android-arm64 android-arm android-x86 android-x64
          J=crates/fo-app/gen/android/app/src/main/jniLibs
          for pair in arm64:arm64-v8a arm:armeabi-v7a x86:x86 x64:x86_64; do
            mkdir -p "$J/${pair#*:}"
            cp "pdfium/android-${pair%%:*}/lib/libpdfium.so" "$J/${pair#*:}/"
          done
      - name: Build APK
        working-directory: crates/fo-app
        run: cargo tauri android build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: fileodyssey-android
          path: crates/fo-app/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
